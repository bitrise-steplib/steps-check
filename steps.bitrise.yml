include:
- path: ./yamlfmt.bitrise.yml
- path: ./step-metadata.bitrise.yml
- path: ./golang.bitrise.yml

workflows:
  check:
    description: Run all shared checks for step repos
    steps:
    - bundle::yamlfmt: {}
    - bundle::step-yml-audit: {}
    - script:
        title: Detect readme-generator doc sections
        inputs:
        - content: |-
            #!/bin/env bash
            set -e

            # By convention, step repos have their example and contribution sections in the docs folder, but this is not a
            # requirement and the file names are not consistent across the step library. We check every name in use and pass
            # the first match to the readme-generator step. If no file is found, the section is left out of the generated
            # README.md and autofix-ci commits the removal, so an unlisted name means silently dropped docs: keep these
            # lists in sync with the step repos.
            detect_section() {
              env_key="$1"
              shift

              for candidate in "$@"; do
                if [ -f "${candidate}" ]; then
                  echo "Using ${env_key} from ${candidate}"
                  envman add --key "${env_key}" --value "${candidate}"
                  return 0
                fi
              done

              echo "No file found for ${env_key} (looked for: $*), the section will be skipped"
              envman add --key "${env_key}" --value ""
            }

            detect_section EXAMPLE_SECTION_PATH docs/examples.md docs/example.md
            detect_section CONTRIB_SECTION_PATH docs/contribution.md docs/contributing.md
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main:
        inputs:
        - example_section: $EXAMPLE_SECTION_PATH
        - contrib_section: $CONTRIB_SECTION_PATH
    - autofix-ci@1:
        inputs:
        - git_remote_url: $BITRISEIO_BASE_REPOSITORY_URL # default URL detection doesn't work because of Unified CI
        - git_token: $PIPELINE_GITHUB_ACCESS_TOKEN # defined as a secret in Unified CI project
    - bundle::golangci-lint:
        inputs:
        - golangci_lint_version: 2.11.4
    - bundle::go-test: {}
