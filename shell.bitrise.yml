step_bundles:
  shellcheck:
    inputs:
    - shellcheck_files: step.sh
      opts:
        description: Space separated list of shell script paths to lint.
    steps:
    - script@1:
        title: Run shellcheck
        deps:
          brew:
          - name: shellcheck
          apt_get:
          - name: shellcheck
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail

            if [[ -z "$shellcheck_files" ]]; then
              echo "Error: shellcheck_files bundle input is not set."
              exit 1
            fi

            set -x
            # shellcheck disable=SC2086 # intentional word splitting: the input is a space separated list
            shellcheck --shell=bash --color=always $shellcheck_files
